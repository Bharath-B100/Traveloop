<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Cities – Traveloop</title>
  <meta name="description" content="Search and discover cities around the world for your next trip.">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search.css">
</head>
<body>
  <div class="page-wrapper"><div class="container">
    <div class="search-page-header">
      <h1>Explore Destinations</h1>
      <p>Discover cities around the world and add them to your itinerary</p>
    </div>
    <div class="search-controls">
      <div class="search-bar" style="flex:1;min-width:240px;margin-bottom:0">
        <span class="search-icon">🔍</span>
        <input type="text" id="cityInput" placeholder="Search cities or countries…" oninput="searchCities()">
      </div>
      <select class="form-select" id="countryFilter" onchange="searchCities()" style="min-width:160px">
        <option value="">All Countries</option>
      </select>
      <select class="form-select" id="sortFilter" onchange="searchCities()" style="min-width:160px">
        <option value="popularity">By Popularity</option>
        <option value="cost_asc">Cheapest First</option>
        <option value="cost_desc">Most Expensive</option>
      </select>
    </div>
    <div class="card-grid" id="cityGrid">
      ${[...Array(8)].map(() => '<div class="card skeleton" style="height:280px"></div>').join('')}
    </div>
  </div></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/city-search.js"></script>
</body>
</html>
