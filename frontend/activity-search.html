<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities – Traveloop</title>
  <meta name="description" content="Browse and search activities for your travel destinations.">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search.css">
</head>
<body>
  <div class="page-wrapper"><div class="container">
    <div class="search-page-header">
      <h1>Browse Activities</h1>
      <p>Find the best things to do at your destinations</p>
    </div>
    <div class="search-controls">
      <div class="search-bar" style="flex:1;min-width:240px;margin-bottom:0">
        <span class="search-icon">🔍</span>
        <input type="text" id="actInput" placeholder="Search activities…" oninput="searchActivities()">
      </div>
      <select class="form-select" id="typeFilter" onchange="searchActivities()" style="min-width:150px">
        <option value="">All Types</option>
        <option value="sightseeing">Sightseeing</option>
        <option value="food">Food & Dining</option>
        <option value="adventure">Adventure</option>
        <option value="culture">Culture</option>
        <option value="nature">Nature</option>
        <option value="nightlife">Nightlife</option>
        <option value="shopping">Shopping</option>
        <option value="wellness">Wellness</option>
      </select>
    </div>
    <div class="activity-filters" id="typeChips">
      <button class="filter-chip active" onclick="setTypeFilter('')" data-type="">All</button>
      <button class="filter-chip" onclick="setTypeFilter('sightseeing')" data-type="sightseeing">🏛 Sightseeing</button>
      <button class="filter-chip" onclick="setTypeFilter('food')" data-type="food">🍜 Food</button>
      <button class="filter-chip" onclick="setTypeFilter('adventure')" data-type="adventure">🏔 Adventure</button>
      <button class="filter-chip" onclick="setTypeFilter('culture')" data-type="culture">🎭 Culture</button>
      <button class="filter-chip" onclick="setTypeFilter('nature')" data-type="nature">🌿 Nature</button>
      <button class="filter-chip" onclick="setTypeFilter('nightlife')" data-type="nightlife">🌙 Nightlife</button>
      <button class="filter-chip" onclick="setTypeFilter('shopping')" data-type="shopping">🛍 Shopping</button>
    </div>
    <div class="activity-grid" id="actGrid">
      ${[...Array(8)].map(() => '<div class="card skeleton" style="height:200px"></div>').join('')}
    </div>
  </div></div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/activity-search.js"></script>
</body>
</html>
