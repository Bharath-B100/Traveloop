<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – Traveloop</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <div class="admin-header" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <h1>Admin Dashboard</h1>
          <p class="subtitle">Platform Analytics and Management</p>
        </div>
        <button class="btn btn-primary" onclick="showAddCityModal()">+ Add Destination</button>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid animate-in" id="statsGrid">
        <!-- populated by js -->
      </div>

      <!-- Main Layout -->
      <div class="admin-layout">
        <!-- Left Column: Charts and Users -->
        <div class="admin-col-main">
          <div class="card animate-in" style="animation-delay:0.1s">
            <h3>Trips Created (Last 30 Days)</h3>
            <div class="chart-container">
              <canvas id="trendsChart"></canvas>
            </div>
          </div>

          <div class="card animate-in" style="animation-delay:0.2s; margin-top:24px">
            <h3>Recent Users</h3>
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Trips</th>
                    <th>Joined</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <!-- populated by js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Right Column: Top Lists -->
        <div class="admin-col-side">
          <div class="card animate-in" style="animation-delay:0.3s">
            <h3>Top Cities</h3>
            <ul class="top-list" id="topCitiesList">
              <!-- populated by js -->
            </ul>
          </div>

          <div class="card animate-in" style="animation-delay:0.4s; margin-top:24px">
            <h3>Top Activities</h3>
            <ul class="top-list" id="topActivitiesList">
              <!-- populated by js -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
